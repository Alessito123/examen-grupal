
services:
  # ========================
  # Next.js App
  # ========================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: examen-grupal-app
    restart: always
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - examen-net
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://postgres:1234@db:5432/sistema_horarios?schema=public
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma generate --schema=backend/prisma/schema.prisma && npx next dev -H 0.0.0.0 -p 3000"
    depends_on:
      - db

  # ========================
  # PostgreSQL Database (Local)
  # ========================
  db:
    image: postgres:16-alpine
    container_name: examen-grupal-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sistema_horarios
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - examen-net

# ========================
# Volumes persistentes
# ========================
volumes:
  pgdata:

# ========================
# Network
# ========================
networks:
  examen-net:
    driver: bridge
